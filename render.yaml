services:
  - type: web
    name: price-tracker-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    autoDeploy: true
    disk:
      name: billing-data
      mountPath: /var/lib/price-tracker-mcp
      sizeGB: 1
    envVars:
      - key: X402_ENABLED
        value: "false"
      - key: X402_PRICE_USDC
        value: "0.015"
      - key: X402_PRICE_CHECK_PRICE_USDC
        value: "0.02"
      - key: X402_PRICE_MAKE_AFFILIATE_LINK_USDC
        value: "0.005"
      - key: X402_PAY_TO
        sync: false
      - key: X402_FACILITATOR_URL
        sync: false
      - key: X402_FACILITATOR_API_KEY
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: STRIPE_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: BILLING_DB_PATH
        value: "/var/lib/price-tracker-mcp/billing.db"
      - key: SUBSCRIBER_MONTHLY_CREDIT_LIMIT
        value: "1000"
      - key: RATE_LIMIT
        value: "60/minute"
      - key: SEARCH_API_KEY
        sync: false
