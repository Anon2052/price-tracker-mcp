services:
  - type: web
    name: price-tracker-mcp
    runtime: image
    image:
      url: docker.io/ioconnex/price-tracker-mcp:20261121a
    healthCheckPath: /health
    plan: starter
    autoDeploy: true
    disk:
      name: billing-data
      mountPath: /var/lib/price-tracker-mcp
      sizeGB: 1
    envVars:
      - key: X402_ENABLED
        value: "true"
      - key: X402_PRICE_USDC
        value: "0.015"
      - key: X402_PRICE_CHECK_PRICE_USDC
        value: "0.008"
      - key: X402_PRICE_MAKE_AFFILIATE_LINK_USDC
        value: "0.005"
      - key: X402_PAY_TO
        sync: false
      - key: X402_FACILITATOR_URL
        sync: false
      - key: X402_FACILITATOR_API_KEY
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: STRIPE_ENABLED
        value: "false"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: BILLING_DB_PATH
        value: "/var/lib/price-tracker-mcp/billing.db"
      - key: SUBSCRIBER_MONTHLY_CREDIT_LIMIT
        value: "1000"
      - key: RATE_LIMIT
        value: "60/minute"
      - key: SEARCH_API_KEY
        sync: false
      # Price Tracker v2 Tier A source keys (find_best_price). Each source
      # stays dark until its key is set; none are required for deploy.
      - key: BESTBUY_API_KEY
        sync: false
      - key: WALMART_CONSUMER_ID
        sync: false
      - key: WALMART_PRIVATE_KEY
        sync: false
      - key: WALMART_KEY_VERSION
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      # Broker layer (find_best_price path="broker"): affiliate PROGRAM
      # enrollment per retailer — separate from the API keys above. The
      # TAG var's presence is the enrollment signal; PARAM overrides the
      # program's tag parameter name; RATE is the program-published
      # commission disclosed in broker responses. All stay unset until
      # each retailer's affiliate program approves (just-in-time).
      - key: BESTBUY_AFFILIATE_TAG
        sync: false
      - key: BESTBUY_AFFILIATE_PARAM
        sync: false
      - key: BESTBUY_AFFILIATE_RATE
        sync: false
      - key: WALMART_AFFILIATE_TAG
        sync: false
      - key: WALMART_AFFILIATE_PARAM
        sync: false
      - key: WALMART_AFFILIATE_RATE
        sync: false
      - key: EBAY_AFFILIATE_TAG
        sync: false
      - key: EBAY_AFFILIATE_PARAM
        sync: false
      - key: EBAY_AFFILIATE_RATE
        sync: false
